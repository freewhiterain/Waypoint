<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>知行 ZhiXing - 您的智能旅伴</title>
    <!-- 引入 Google Fonts: Noto Serif SC (宋体-知性), Noto Sans SC (黑体-现代), Playfair Display (英文衬线) -->
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500&family=Noto+Serif+SC:wght@500;700&family=Playfair+Display:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <!-- 引入 FontAwesome 图标库 -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <!-- Markdown 解析（BootCDN 国内镜像） -->
    <script src="https://cdn.bootcdn.net/ajax/libs/marked/12.0.2/marked.min.js"></script>
    <!-- HTML 消毒（防 XSS） -->
    <script src="https://cdn.bootcdn.net/ajax/libs/dompurify/3.1.6/purify.min.js"></script>

    <style>
      :root {
        /* 配色方案：知行 - 大地与海洋 */
        --primary: #1a4d54; /* 深黛绿 - 沉稳 */
        --primary-light: #2c6e7a;
        --accent: #c28e5c; /* 古铜金 - 高级感强调色 */
        --accent-hover: #a67545;

        --sand-bg: #f5f2eb; /* 米白纸张色 */
        --map-line: rgba(26, 77, 84, 0.08); /* 地图纹理色 */

        --glass-bg: rgba(255, 255, 255, 0.75);
        --glass-border: rgba(255, 255, 255, 0.6);
        --glass-shadow: 0 8px 32px 0 rgba(26, 77, 84, 0.08);

        --text-main: #2c3e50;
        --text-serif: #1a4d54;
        --text-light: #7f8c8d;
        --white: #ffffff;

        --radius-lg: 24px;
        --radius-md: 16px;
        --radius-sm: 8px;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-font-smoothing: antialiased;
      }

      body {
        font-family: "Noto Sans SC", sans-serif;
        color: var(--text-main);
        height: 100vh;
        overflow: hidden;
        background-color: var(--sand-bg);
        /* 细微的纸张噪点纹理 */
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.05'/%3E%3C/svg%3E");
      }

      /* === 背景装饰元素 === */

      /* 1. 等高线地图背景 */
      .bg-map-lines {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-image: url("data:image/svg+xml,%3Csvg width='100%25' height='100%25' viewBox='0 0 800 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' stroke='%231A4D54' stroke-width='1' stroke-opacity='0.08'%3E%3Cpath d='M0 300 C 200 400 400 200 800 350' /%3E%3Cpath d='M0 320 C 220 420 420 220 800 370' /%3E%3Cpath d='M0 340 C 240 440 440 240 800 390' /%3E%3Cpath d='M0 100 C 300 0 500 150 800 50' /%3E%3Cpath d='M0 120 C 320 20 520 170 800 70' /%3E%3Cpath d='M-100 200 C 200 100 600 300 900 200' stroke-dasharray='10,10' stroke-opacity='0.05' /%3E%3C/g%3E%3C/svg%3E");
        background-size: cover;
        pointer-events: none;
        z-index: 0;
      }

      /* 2. 飞行动画 */
      .plane-container {
        position: fixed;
        top: 20%;
        left: -100px;
        z-index: 0;
        opacity: 0.8;
        animation: flyAcross 60s linear infinite;
      }

      .plane-icon {
        font-size: 24px;
        color: var(--accent);
        transform: rotate(15deg);
      }

      .plane-trail {
        position: absolute;
        top: 12px;
        right: 20px;
        width: 100px;
        height: 2px;
        background: linear-gradient(
          90deg,
          transparent,
          rgba(194, 142, 92, 0.3)
        );
      }

      @keyframes flyAcross {
        0% {
          transform: translate(-100px, 0);
        }
        100% {
          transform: translate(calc(100vw + 200px), -100px);
        }
      }

      /* 主布局 */
      .app-container {
        position: relative;
        z-index: 1;
        display: flex;
        height: 100vh;
        padding: 24px;
        gap: 24px;
        max-width: 1600px;
        margin: 0 auto;
      }

      /* 玻璃拟态卡片通用样式 */
      .glass-card {
        background: var(--glass-bg);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid var(--glass-border);
        box-shadow: var(--glass-shadow);
      }

      /* === 登录/注册 === */
      .auth-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(26, 77, 84, 0.3);
        backdrop-filter: blur(8px);
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 100;
        transition: opacity 0.3s ease;
      }

      .auth-overlay.hidden {
        display: none;
      }

      .auth-card {
        width: 400px;
        padding: 40px;
        border-radius: var(--radius-lg);
        background: rgba(255, 255, 255, 0.95);
        position: relative;
        overflow: hidden;
      }

      /* 邮票装饰 */
      .stamp-decoration {
        position: absolute;
        top: -20px;
        right: -20px;
        width: 100px;
        height: 100px;
        border: 2px dashed var(--accent);
        border-radius: 50%;
        opacity: 0.2;
        transform: rotate(20deg);
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: "Playfair Display", serif;
        color: var(--accent);
        font-weight: bold;
        pointer-events: none;
      }

      .auth-header {
        text-align: center;
        margin-bottom: 30px;
      }

      .auth-logo {
        font-family: "Noto Serif SC", serif;
        font-size: 36px;
        font-weight: 700;
        color: var(--primary);
        margin-bottom: 8px;
        letter-spacing: 4px;
      }

      .auth-logo i {
        font-size: 24px;
        color: var(--accent);
        margin-right: 8px;
      }

      .auth-subtitle {
        font-family: "Playfair Display", serif;
        color: var(--text-light);
        font-style: italic;
      }

      .auth-tabs {
        display: flex;
        border-bottom: 1px solid #ddd;
        margin-bottom: 24px;
      }

      .auth-tab {
        flex: 1;
        padding: 12px;
        background: none;
        border: none;
        font-size: 15px;
        color: var(--text-light);
        cursor: pointer;
        position: relative;
      }

      .auth-tab.active {
        color: var(--primary);
        font-weight: 600;
      }

      .auth-tab.active::after {
        content: "";
        position: absolute;
        bottom: -1px;
        left: 0;
        width: 100%;
        height: 2px;
        background: var(--primary);
      }

      .form-group {
        margin-bottom: 16px;
      }

      .form-group input {
        width: 100%;
        padding: 12px;
        border: 1px solid #ddd;
        border-radius: 4px; /* 略微方正，更像传统表单 */
        background: #fff;
        transition: all 0.3s;
      }

      .form-group input:focus {
        outline: none;
        border-color: var(--primary);
        box-shadow: 0 0 0 2px rgba(26, 77, 84, 0.1);
      }

      .auth-btn {
        width: 100%;
        padding: 14px;
        background: var(--primary);
        color: var(--white);
        border: none;
        border-radius: 4px;
        font-size: 15px;
        cursor: pointer;
        transition: background 0.3s;
      }

      .auth-btn:hover {
        background: var(--primary-light);
      }

      .register-fields {
        display: none;
      }
      .register-fields.show {
        display: block;
      }

      .api-config {
        margin-top: 20px;
        text-align: center;
        font-size: 12px;
      }
      .api-config summary {
        cursor: pointer;
        color: var(--text-light);
      }
      .api-config input {
        margin-top: 5px;
        padding: 5px;
        width: 80%;
        text-align: center;
      }

      /* === 侧边栏 (类似护照/手账本) === */
      .sidebar {
        width: 280px;
        border-radius: var(--radius-lg);
        display: flex;
        flex-direction: column;
        background: rgba(255, 255, 255, 0.85);
        backdrop-filter: blur(20px);
        border: 1px solid var(--white);
        box-shadow: var(--glass-shadow);
      }

      .sidebar-header {
        padding: 32px 24px 20px;
        border-bottom: 1px dashed rgba(0, 0, 0, 0.1); /* 虚线像票据 */
      }

      .sidebar-logo-text {
        font-family: "Noto Serif SC", serif;
        font-size: 24px;
        font-weight: 700;
        color: var(--primary);
        letter-spacing: 2px;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .user-passport {
        margin-top: 20px;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px;
        background: #f0f4f5;
        border-radius: 8px;
        border: 1px solid #e0e6e8;
      }

      .user-avatar-frame {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background: var(--primary);
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 2px solid var(--accent); /* 金色边框 */
      }

      .user-details h4 {
        font-size: 14px;
        color: var(--primary);
      }
      .user-details span {
        font-size: 11px;
        color: var(--text-light);
        text-transform: uppercase;
      }

      .new-chat-btn {
        margin: 20px 24px;
        padding: 12px;
        border: 1px solid var(--primary);
        background: transparent;
        color: var(--primary);
        border-radius: var(--radius-sm);
        cursor: pointer;
        transition: all 0.3s;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        font-weight: 600;
      }

      .new-chat-btn:hover {
        background: var(--primary);
        color: var(--white);
      }

      .conversations-list {
        flex: 1;
        overflow-y: auto;
        padding: 0 16px;
      }

      .section-label {
        padding: 0 8px 8px;
        font-size: 11px;
        color: var(--text-light);
        text-transform: uppercase;
        letter-spacing: 1px;
      }

      .conversation-item {
        padding: 14px;
        margin-bottom: 8px;
        border-radius: 6px;
        cursor: pointer;
        transition: all 0.2s;
        border-left: 3px solid transparent;
        background: rgba(255, 255, 255, 0.5);
      }

      .conversation-item:hover {
        background: var(--white);
      }

      .conversation-item.active {
        background: var(--white);
        border-left-color: var(--accent);
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
      }

      .conversation-title {
        font-size: 14px;
        font-weight: 500;
        color: var(--text-main);
        margin-bottom: 4px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .conversation-time {
        font-size: 11px;
        color: var(--text-light);
        display: flex;
        align-items: center;
        gap: 4px;
      }

      .logout-btn {
        margin: 20px;
        padding: 10px;
        border: none;
        background: none;
        color: var(--text-light);
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
      }
      .logout-btn:hover {
        color: #d63031;
      }

      /* === 聊天主窗口 === */
      .chat-main {
        flex: 1;
        display: flex;
        flex-direction: column;
        border-radius: var(--radius-lg);
        overflow: hidden;
        position: relative;
      }

      /* 聊天背景水印 - 地球仪 */
      .chat-watermark {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: 300px;
        color: var(--primary);
        opacity: 0.03;
        pointer-events: none;
        z-index: -1;
      }

      .chat-header {
        padding: 20px 32px;
        background: rgba(255, 255, 255, 0.9);
        border-bottom: 1px solid rgba(0, 0, 0, 0.05);
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .chat-title-group {
        display: flex;
        align-items: center;
        gap: 16px;
      }

      .chat-icon-wrapper {
        width: 48px;
        height: 48px;
        background: var(--primary);
        color: var(--accent);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 20px;
        box-shadow: 0 4px 12px rgba(26, 77, 84, 0.2);
      }

      .chat-info h2 {
        font-family: "Noto Serif SC", serif;
        font-size: 20px;
        color: var(--text-serif);
      }

      .chat-info p {
        font-size: 12px;
        color: var(--text-light);
        margin-top: 2px;
      }

      .location-badge {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        color: var(--accent);
        font-weight: 600;
        background: rgba(194, 142, 92, 0.1);
        padding: 6px 12px;
        border-radius: 20px;
      }

      .chat-messages {
        flex: 1;
        padding: 32px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 28px;
      }

      /* 消息气泡 - 模拟信纸/卡片 */
      .message {
        display: flex;
        gap: 16px;
        max-width: 800px;
        animation: slideIn 0.3s ease;
      }

      @keyframes slideIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .message.user {
        flex-direction: row-reverse;
        align-self: flex-end;
      }

      .message-avatar {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        font-size: 14px;
      }

      .message.user .message-avatar {
        background: var(--accent);
        color: white;
      }
      .message.assistant .message-avatar {
        background: var(--primary);
        color: white;
      }

      .message-content {
        padding: 16px 24px;
        border-radius: 12px;
        font-size: 15px;
        line-height: 1.8;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        position: relative;
      }

      .message.assistant .message-content {
        background: #fff;
        border: 1px solid rgba(0, 0, 0, 0.05);
        color: var(--text-main);
        border-top-left-radius: 2px;
      }

      /* 装饰助手消息：像一张票据 */
      .message.assistant .message-content::before {
        content: "";
        position: absolute;
        left: 0;
        top: 15px;
        bottom: 15px;
        width: 3px;
        background: var(--accent);
        border-radius: 0 2px 2px 0;
        opacity: 0.5;
      }

      .message.user .message-content {
        background: var(--primary);
        color: white;
        border-top-right-radius: 2px;
      }

      /* 欢迎屏幕 */
      .welcome-screen {
        text-align: center;
        margin: auto;
        max-width: 500px;
        padding: 40px;
        background: rgba(255, 255, 255, 0.6);
        border-radius: 20px;
        border: 1px dashed var(--primary); /* 虚线框 */
      }

      .welcome-logo {
        font-size: 50px;
        color: var(--primary);
        margin-bottom: 20px;
      }

      .welcome-title {
        font-family: "Noto Serif SC", serif;
        font-size: 28px;
        margin-bottom: 10px;
        color: var(--text-serif);
      }

      .welcome-text {
        color: var(--text-light);
        line-height: 1.6;
      }

      /* 输入区域 */
      .chat-input-area {
        padding: 24px 32px;
        background: rgba(255, 255, 255, 0.9);
        border-top: 1px solid rgba(0, 0, 0, 0.05);
      }

      .chat-input-wrapper {
        display: flex;
        align-items: flex-end;
        background: var(--white);
        border: 1px solid #e0e0e0;
        border-radius: 12px;
        padding: 8px 8px 8px 16px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
        transition: border 0.3s;
      }

      .chat-input-wrapper:focus-within {
        border-color: var(--primary);
      }

      .chat-input {
        flex: 1;
        border: none;
        padding: 10px 0;
        font-family: inherit;
        font-size: 15px;
        resize: none;
        max-height: 120px;
        background: transparent;
      }

      .chat-input:focus {
        outline: none;
      }

      .send-btn {
        width: 40px;
        height: 40px;
        border: none;
        border-radius: 8px;
        background: var(--primary);
        color: var(--accent);
        font-size: 16px;
        cursor: pointer;
        transition: all 0.2s;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .send-btn:hover {
        background: var(--primary-light);
        color: #fff;
      }
      .send-btn:disabled {
        background: #ccc;
        cursor: not-allowed;
      }

      /* 加载动画 */
      .typing-dots {
        display: flex;
        gap: 4px;
        padding: 10px;
      }
      .dot {
        width: 6px;
        height: 6px;
        background: var(--primary);
        border-radius: 50%;
        opacity: 0.5;
        animation: bounce 1.4s infinite ease-in-out;
      }
      .dot:nth-child(1) {
        animation-delay: -0.32s;
      }
      .dot:nth-child(2) {
        animation-delay: -0.16s;
      }
      @keyframes bounce {
        0%,
        80%,
        100% {
          transform: scale(0);
        }
        40% {
          transform: scale(1);
        }
      }

      /* Toast */
      .toast {
        position: fixed;
        top: 30px;
        left: 50%;
        transform: translateX(-50%) translateY(-100px);
        background: var(--text-main);
        color: white;
        padding: 12px 24px;
        border-radius: 50px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        z-index: 1000;
        font-size: 14px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .toast.show {
        transform: translateX(-50%) translateY(0);
      }
      .toast.error {
        background: #c0392b;
      }

      /* 响应式 */
      @media (max-width: 900px) {
        .app-container {
          flex-direction: column;
          padding: 10px;
        }
        .sidebar {
          width: 100%;
          height: auto;
          flex-direction: row;
          align-items: center;
          padding: 10px;
        }
        .sidebar-header {
          padding: 0;
          border: none;
          flex: 1;
        }
        .user-passport,
        .conversations-list,
        .logout-btn,
        .section-label {
          display: none;
        }
        .new-chat-btn {
          margin: 0;
          padding: 8px;
          width: 40px;
          border: none;
        }
        .new-chat-btn span {
          display: none;
        }
        .chat-header {
          padding: 15px;
        }
      }

      /* === Assistant 消息里的 Markdown 样式 === */
      .message.assistant .message-content h1,
      .message.assistant .message-content h2,
      .message.assistant .message-content h3,
      .message.assistant .message-content h4 {
        margin: 12px 0 6px 0;
        font-weight: 600;
        color: var(--text-serif);
      }
      .message.assistant .message-content h1 { font-size: 18px; }
      .message.assistant .message-content h2 { font-size: 16px; }
      .message.assistant .message-content h3 { font-size: 14px; }
      .message.assistant .message-content h4 { font-size: 13px; }
      .message.assistant .message-content strong {
        color: var(--primary);
        font-weight: 600;
      }
      .message.assistant .message-content em { font-style: italic; }
      .message.assistant .message-content ul,
      .message.assistant .message-content ol {
        margin: 6px 0 6px 20px;
        padding-left: 20px;
      }
      .message.assistant .message-content li { margin: 3px 0; }
      .message.assistant .message-content code {
        background: rgba(26, 77, 84, 0.08);
        padding: 1px 5px;
        border-radius: 3px;
        font-family: "Courier New", Consolas, monospace;
        font-size: 13px;
        color: var(--primary);
      }
      .message.assistant .message-content pre {
        background: #f5f2eb;
        padding: 10px;
        border-radius: 6px;
        overflow-x: auto;
        margin: 8px 0;
      }
      .message.assistant .message-content pre code {
        background: transparent;
        padding: 0;
        color: var(--text-main);
      }
      .message.assistant .message-content p { margin: 6px 0; }
      .message.assistant .message-content a {
        color: var(--accent);
        text-decoration: underline;
      }
      .message.assistant .message-content blockquote {
        border-left: 3px solid var(--accent);
        padding-left: 10px;
        color: var(--text-light);
        margin: 6px 0;
      }
      .message.assistant .message-content hr {
        border: none;
        border-top: 1px dashed var(--map-line);
        margin: 10px 0;
      }

      .chat-input-area:not(.trip-active) #tripDock,
      .chat-input-area.trip-active .chat-input-wrapper { display: none; }
      .trip-tool-status { margin-top: 8px; font-size: 13px; color: var(--text-light); }
      .trip-tool-status i { margin-right: 4px; color: var(--primary); }
      .trip-tool-reopen {
        padding: 0;
        border: 0;
        background: none;
        color: var(--primary);
        font: inherit;
        text-decoration: underline;
        cursor: pointer;
      }
      .trip-tool {
        padding: 16px 16px 14px;
        border: 1px solid rgba(26, 77, 84, 0.14);
        border-radius: var(--radius-md);
        background: var(--white);
        box-shadow: 0 6px 24px rgba(26, 77, 84, 0.06);
        outline: none;
      }

      .trip-tool-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 10px;
      }

      .trip-tool-title { font-weight: 600; font-size: 15px; color: var(--text-main); }
      .trip-tool-actions { display: flex; align-items: center; gap: 2px; flex-shrink: 0; }
      .trip-tool-progress { min-width: 30px; text-align: center; font-size: 14px; color: var(--text-main); }
      .trip-tool-icon {
        width: 30px;
        height: 30px;
        border: 0;
        border-radius: 6px;
        background: transparent;
        color: var(--text-light);
        cursor: pointer;
      }
      .trip-tool-icon:hover:not(:disabled) { background: #f1f3f2; color: var(--text-main); }
      .trip-tool-icon:disabled { opacity: 0.35; cursor: default; }

      .trip-tool-list { display: grid; }
      .trip-tool-row {
        display: flex;
        align-items: center;
        gap: 12px;
        width: 100%;
        min-height: 48px;
        padding: 8px 10px;
        border: 0;
        border-bottom: 1px solid #eef0ef;
        border-radius: 0;
        background: transparent;
        color: var(--text-main);
        font: inherit;
        text-align: left;
        cursor: pointer;
      }
      .trip-tool-row:hover,
      .trip-tool-row:focus-visible,
      .trip-tool-row.selected {
        border-radius: 10px;
        border-bottom-color: transparent;
        background: #f1f3f2;
        outline: none;
      }
      .trip-tool-row.selected { background: #e7f0ef; }
      .trip-tool-index {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        width: 26px;
        height: 26px;
        border-radius: 6px;
        background: #f1f3f2;
        font-size: 13px;
      }
      .trip-tool-row:hover .trip-tool-index,
      .trip-tool-row:focus-visible .trip-tool-index { background: var(--white); }
      .trip-tool-row.selected .trip-tool-index { background: var(--primary); color: var(--white); }
      .trip-tool-label { flex: 1; min-width: 0; }
      .trip-tool-label small { margin-left: 6px; color: var(--text-light); font-size: 12px; }
      .trip-tool-arrow { color: var(--text-main); opacity: 0; }
      .trip-tool-row:hover .trip-tool-arrow,
      .trip-tool-row:focus-visible .trip-tool-arrow,
      .trip-tool-row.selected .trip-tool-arrow { opacity: 1; }
      .trip-tool-other { cursor: text; }
      .trip-tool-input {
        flex: 1;
        min-width: 0;
        border: 0;
        background: transparent;
        color: var(--text-main);
        font: inherit;
        outline: none;
      }
      .trip-tool-input::placeholder { color: var(--text-light); }

      .trip-tool-error { min-height: 18px; margin-top: 6px; font-size: 12px; color: #b42318; }
      .trip-tool-hint { font-size: 13px; color: var(--text-light); }
      .trip-tool-footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-top: 6px;
      }
      .trip-tool-summary { font-size: 13px; color: var(--text-light); }
      .trip-tool-send {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        width: 38px;
        height: 38px;
        margin-left: auto;
        border: 0;
        border-radius: 50%;
        background: var(--primary);
        color: var(--white);
        cursor: pointer;
      }
      .trip-tool-send:hover:not(:disabled) { background: var(--primary-light); }
      .trip-tool-send:disabled { cursor: wait; opacity: 0.55; }
      .trip-tool-recommendation { margin-top: 10px; color: var(--text-main); font-size: 13px; line-height: 1.55; }
      .worker-results { margin-top: 14px; padding: 12px; border: 1px solid var(--border); background: #f8faf9; }
      .worker-results-title { display: flex; justify-content: space-between; gap: 12px; font-weight: 700; color: var(--primary); }
      .worker-results-label { font-size: 11px; color: var(--text-light); font-weight: 500; }
      .worker-row { margin-top: 8px; padding: 9px 10px; border-left: 3px solid #9aa7a2; background: #fff; }
      .worker-row.completed { border-left-color: #2f855a; }
      .worker-row.partial { border-left-color: #c88a20; }
      .worker-row.unavailable, .worker-row.failed { border-left-color: #b42318; }
      .worker-row-head { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; }
      .worker-status { color: var(--text-light); font-size: 12px; }
      .worker-row p { margin: 5px 0 0; font-size: 12px; line-height: 1.5; }
      .worker-row details { margin-top: 6px; font-size: 12px; color: var(--text-light); }
      .worker-row li { margin: 3px 0; }

      @media (max-width: 560px) {
        .trip-tool { padding: 12px 10px 10px; }
        .trip-tool-header { align-items: flex-start; }
      }
    </style>
  </head>
  <body>
    <!-- 装饰背景 -->
    <div class="bg-map-lines"></div>
    <div class="plane-container">
      <div class="plane-trail"></div>
      <i class="fa-solid fa-plane plane-icon"></i>
    </div>

    <!-- 登录弹窗 -->
    <div class="auth-overlay" id="authOverlay">
      <div class="auth-card glass-card">
        <!-- 装饰性邮戳 -->
        <div class="stamp-decoration">VISA</div>

        <div class="auth-header">
          <div class="auth-logo"><i class="fa-solid fa-compass"></i>知行</div>
          <p class="auth-subtitle">
            Read Thousands of Books, Travel Thousands of Miles
          </p>
        </div>

        <div class="auth-tabs">
          <button
            class="auth-tab active"
            data-tab="login"
            onclick="switchAuthTab('login')"
          >
            登 录
          </button>
          <button
            class="auth-tab"
            data-tab="register"
            onclick="switchAuthTab('register')"
          >
            注 册
          </button>
        </div>

        <form id="authForm" onsubmit="handleAuth(event)">
          <div class="form-group">
            <input
              type="text"
              id="username"
              placeholder="通行证 / 用户名"
              required
            />
          </div>
          <div class="form-group register-fields" id="emailField">
            <input type="email" id="email" placeholder="电子邮箱" />
          </div>
          <div class="form-group">
            <input
              type="password"
              id="password"
              placeholder="密钥 / 密码"
              required
            />
          </div>
          <button type="submit" class="auth-btn" id="authBtn">开启旅程</button>
        </form>

        <details class="api-config">
          <summary>连接设置</summary>
          <input type="text" id="apiBase" value="http://localhost:18000" />
        </details>
      </div>
    </div>

    <!-- 主界面 -->
    <div class="app-container">
      <!-- 侧边栏：像一本护照 -->
      <aside class="sidebar glass-card">
        <div class="sidebar-header">
          <div class="sidebar-logo-text">
            <i class="fa-solid fa-mountain-sun"></i> 知行
          </div>
          <div class="user-passport">
            <div class="user-avatar-frame" id="userAvatar">User</div>
            <div class="user-details">
              <h4 id="userName">访客</h4>
              <span>PASSPORT</span>
            </div>
          </div>
        </div>

        <button class="new-chat-btn" onclick="createNewConversation()">
          <i class="fa-solid fa-route"></i> <span>规划新行程</span>
        </button>

        <div class="conversations-list">
          <div class="section-label">Travel Logs</div>
          <div id="conversationsList"></div>
        </div>

        <button class="logout-btn" onclick="logout()">
          <i class="fa-solid fa-power-off"></i> 结束本次旅程
        </button>
      </aside>

      <!-- 聊天主窗口 -->
      <main class="chat-main glass-card">
        <!-- 水印 -->
        <i class="fa-solid fa-earth-asia chat-watermark"></i>

        <div class="chat-header">
          <div class="chat-title-group">
            <div class="chat-icon-wrapper">
              <i class="fa-solid fa-robot"></i>
            </div>
            <div class="chat-info">
              <h2 id="chatTitle">行程助手</h2>
              <p>AI Travel Assistant</p>
            </div>
          </div>
          <div class="location-badge">
            <i class="fa-solid fa-location-dot"></i> 准备出发
          </div>
        </div>

        <div class="chat-messages" id="chatMessages">
          <div class="welcome-screen">
            <div class="welcome-logo">
              <i class="fa-solid fa-paper-plane"></i>
            </div>
            <h3 class="welcome-title">欢迎使用 知行</h3>
            <p class="welcome-text">
              告诉我你想去哪里？我可以帮你规划路线、寻找隐秘的沙滩、预订最棒的日落景观位。
            </p>
          </div>
        </div>

        <div class="chat-input-area">
          <div class="chat-input-wrapper">
            <textarea
              class="chat-input"
              id="chatInput"
              placeholder="输入目的地，例如：马尔代夫的水上飞机体验..."
              rows="1"
              onkeydown="handleInputKeydown(event)"
            ></textarea>
            <button class="send-btn" id="sendBtn" onclick="sendMessage()">
              <i class="fa-regular fa-paper-plane"></i>
            </button>
          </div>
        </div>
      </main>
    </div>

    <div class="toast" id="toast">
      <i class="fa-solid fa-info-circle"></i> <span id="toastMsg"></span>
    </div>

    <script>
      // === 逻辑代码保持不变，仅适配样式类名 ===

      let state = {
        token: localStorage.getItem("token") || "",
        user: JSON.parse(localStorage.getItem("user") || "null"),
        currentConversationId: null,
        conversations: [],
        isLoading: false,
        tripTools: {},
      };

      const getApiBase = () =>
        document.getElementById("apiBase").value || "http://localhost:18000";

      document.addEventListener("DOMContentLoaded", () => {
        if (state.token && state.user) {
          hideAuthOverlay();
          updateUserInfo();
          loadConversations();
        }
        autoResizeTextarea();
      });

      function switchAuthTab(tab) {
        const tabs = document.querySelectorAll(".auth-tab");
        const emailField = document.getElementById("emailField");
        const emailInput = document.getElementById("email");
        const authBtn = document.getElementById("authBtn");

        tabs.forEach((t) => t.classList.remove("active"));
        document.querySelector(`[data-tab="${tab}"]`).classList.add("active");

        if (tab === "register") {
          emailField.classList.add("show");
          emailInput.required = true;
          authBtn.textContent = "注册通行证";
        } else {
          emailField.classList.remove("show");
          emailInput.required = false;
          authBtn.textContent = "开启旅程";
        }
      }

      async function handleAuth(e) {
        e.preventDefault();
        const isRegister =
          document.querySelector(".auth-tab.active").dataset.tab === "register";
        const username = document.getElementById("username").value;
        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;
        const btn = document.getElementById("authBtn");

        btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> 验证中...';
        btn.disabled = true;

        try {
          let response;
          const endpoint = isRegister
            ? "/api/v1/users/register"
            : "/api/v1/users/login";
          const body = isRegister
            ? { username, email, password }
            : { username, password };

          response = await fetch(`${getApiBase()}${endpoint}`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(body),
          });

          const data = await response.json();

          if (response.ok) {
            state.token = data.access_token;
            state.user = data.user;
            localStorage.setItem("token", state.token);
            localStorage.setItem("user", JSON.stringify(state.user));
            showToast(isRegister ? "欢迎加入知行！" : "欢迎回来！");
            hideAuthOverlay();
            updateUserInfo();
            loadConversations();
          } else {
            showToast(data.detail || "操作失败", true);
          }
        } catch (error) {
          showToast("网络连接异常", true);
        } finally {
          btn.innerHTML = isRegister ? "注册通行证" : "开启旅程";
          btn.disabled = false;
        }
      }

      function hideAuthOverlay() {
        document.getElementById("authOverlay").classList.add("hidden");
      }
      function showAuthOverlay() {
        document.getElementById("authOverlay").classList.remove("hidden");
      }

      function updateUserInfo() {
        if (state.user) {
          document.getElementById("userName").textContent =
            state.user.username || "旅行者";
          // 提取首字母
          const name = state.user.username || state.user.email || "U";
          document.getElementById("userAvatar").textContent =
            name[0].toUpperCase();
        }
      }

      function logout() {
        state.token = "";
        state.user = null;
        state.currentConversationId = null;
        state.conversations = [];
        localStorage.removeItem("token");
        localStorage.removeItem("user");
        showAuthOverlay();
        clearChatMessages();
        document.getElementById("conversationsList").innerHTML = "";
        showToast("已退出旅程");
      }

      async function loadConversations() {
        try {
          const response = await fetch(`${getApiBase()}/api/v1/conversations`, {
            headers: { Authorization: `Bearer ${state.token}` },
          });
          if (response.ok) {
            const data = await response.json();
            state.conversations = Array.isArray(data)
              ? data
              : data.conversations || [];
            renderConversationsList();
          } else if (response.status === 401) logout();
        } catch (error) {
          console.error(error);
        }
      }

      function renderConversationsList() {
        const container = document.getElementById("conversationsList");
        if (state.conversations.length === 0) {
          container.innerHTML =
            '<div style="padding:20px; text-align:center; color:var(--text-light); font-size:12px;">暂无行程记录</div>';
          return;
        }
        container.innerHTML = state.conversations
          .map(
            (conv) => `
                <div class="conversation-item ${
                  conv.id === state.currentConversationId ? "active" : ""
                }" 
                     onclick="switchConversation('${conv.id}')">
                    <div class="conversation-title"><i class="fa-solid fa-map-pin" style="font-size:10px; margin-right:5px; color:var(--accent)"></i>${
                      conv.title || "未知行程"
                    }</div>
                    <div class="conversation-time">
                        <i class="fa-regular fa-clock" style="font-size:10px;"></i> ${formatTime(
                          conv.updated_at || conv.created_at
                        )}
                    </div>
                </div>
            `
          )
          .join("");
      }

      async function createNewConversation() {
        try {
          const response = await fetch(`${getApiBase()}/api/v1/conversations`, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Authorization: `Bearer ${state.token}`,
            },
            body: JSON.stringify({ title: "新行程" }),
          });
          if (response.ok) {
            const data = await response.json();
            state.currentConversationId = data.id;
            await loadConversations();
            if (data.initial_message) {
              renderMessages([data.initial_message]);
            } else {
              clearChatMessages();
            }
            document.getElementById("chatTitle").textContent = "新行程";
            showToast("新行程已创建");
          }
        } catch (error) {
          showToast("创建失败", true);
        }
      }

      async function switchConversation(id) {
        state.currentConversationId = id;
        renderConversationsList();

        // 获取标题
        try {
          const res = await fetch(
            `${getApiBase()}/api/v1/conversations/${id}`,
            {
              headers: { Authorization: `Bearer ${state.token}` },
            }
          );
          if (res.ok) {
            const data = await res.json();
            document.getElementById("chatTitle").textContent = data.title;
          }
        } catch (e) {}

        // 获取历史
        try {
          const res = await fetch(`${getApiBase()}/api/v1/chat/history/${id}`, {
            headers: { Authorization: `Bearer ${state.token}` },
          });
          if (res.ok) {
            const data = await res.json();
            const msgs = Array.isArray(data) ? data : data.messages || [];
            renderMessages(msgs);
          } else clearChatMessages();
        } catch (e) {
          clearChatMessages();
        }
      }

      function renderMessages(messages) {
        const container = document.getElementById("chatMessages");
        if (messages.length === 0) {
          clearChatMessages();
          return;
        }
        state.tripTools = {};
        renderTripDock();
        container.innerHTML = messages
          .map(
            (msg, index) => `
                <div class="message ${
                  msg.role
                }" id="history-msg-${index}">
                    <div class="message-avatar"><i class="fa-solid ${
                      msg.role === "user" ? "fa-user" : "fa-robot"
                    }"></i></div>
                    <div class="message-content">${renderContent(msg.role, msg.content)}</div>
                </div>
            `
          )
          .join("");
        let latestCallId = null;
        messages.forEach((msg, index) => {
          const extra_info = msg.extra_info || {};
          const toolCall = extra_info.tool_call;
          if (toolCall && toolCall.tool === "collect_trip_requirements") {
            latestCallId = toolCall.call_id;
            receiveTripToolCall(toolCall, `history-msg-${index}`, false);
          } else if (toolCall) {
            appendResearchEvent(`history-msg-${index}`, {
              type: "agent_tool_call",
              payload: toolCall,
            });
          }
          if (extra_info.assistant_result) {
            appendWorkerResults(`history-msg-${index}`, extra_info.assistant_result);
          }
        });
        messages.forEach((msg) => {
          const extra_info = msg.extra_info || {};
          const toolResult = extra_info.tool_result;
          if (toolResult) {
            if (toolResult.tool_name) {
              appendAgentToolResult(`history-msg-${index}`, toolResult, false);
            } else {
              applyTripToolResult(
                toolResult,
                toolResult.call_id || toolResult.task_id || latestCallId,
                false
              );
            }
          }
        });
        restorePendingTool();
        container.scrollTop = container.scrollHeight;
      }

      function clearChatMessages() {
        state.tripTools = {};
        renderTripDock();
        document.getElementById("chatMessages").innerHTML = `
                <div class="welcome-screen">
                    <div class="welcome-logo"><i class="fa-solid fa-paper-plane"></i></div>
                    <h3 class="welcome-title">欢迎使用 知行</h3>
                    <p class="welcome-text">告诉我你想去哪里？我可以帮你规划路线、寻找隐秘的沙滩、预订最棒的日落景观位。</p>
                </div>
            `;
      }

      function todayIso() {
        const now = new Date();
        const offset = now.getTimezoneOffset() * 60000;
        return new Date(now.getTime() - offset).toISOString().slice(0, 10);
      }

      function escapeAttribute(value) {
        return String(value ?? "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      const TRIP_DESTINATIONS = ["北京", "上海", "成都", "厦门"];
      const TRIP_DAY_OPTIONS = [2, 3, 5, 7];
      const TRIP_QUESTIONS = { 1: "你想去哪里？", 2: "什么时候出发？", 3: "计划旅行几天？" };
      const WEEKDAYS = ["周日", "周一", "周二", "周三", "周四", "周五", "周六"];

      function tripStepField(step) {
        return ["destination", "departure_date", "days"][step - 1];
      }

      function tripStepError(step, values) {
        if (step === 1 && !String(values.destination || "").trim()) return "请选择或输入目的地。";
        if (step === 2) {
          const date = values.departure_date;
          if (!date) return "请选择出发日期。";
          if (date < todayIso()) return "出发日期不能早于今天。";
        }
        if (step === 3) {
          const days = Number(values.days);
          if (!Number.isInteger(days) || days < 1 || days > 30) return "旅行天数请输入 1-30 的整数。";
        }
        return "";
      }

      // 填槽：只为还缺（或不合法）的槽位出题，用户在第一句话里说过的不再问。
      function missingTripSteps(values) {
        return [1, 2, 3].filter((step) => tripStepError(step, values));
      }

      function tripToolDefaults(call, messageId) {
        const initial = call.arguments?.initial_values || call.arguments || {};
        const values = {
          destination: initial.destination || "",
          departure_date: initial.departure_date || "",
          days: initial.days == null ? "" : String(initial.days),
        };
        const askSteps = missingTripSteps(values);
        return {
          callId: call.call_id,
          tool: call.tool,
          messageId,
          askSteps,
          // 三个槽位都已知时不出题，先让用户确认再开始规划。
          confirming: askSteps.length === 0,
          currentStep: askSteps[0] || 3,
          values,
          errors: {},
          submitting: false,
          closed: false,
          status: "pending",
          recommendation: "",
        };
      }

      function findTripToolPanel(callId) {
        return Array.from(document.querySelectorAll("[data-trip-call-id]")).find(
          (panel) => panel.dataset.tripCallId === callId
        );
      }

      function receiveTripToolCall(call, messageId, shouldScroll = true) {
        if (!call || !call.call_id || call.tool !== "collect_trip_requirements") return;
        const existing = state.tripTools[call.call_id];
        if (!existing) {
          state.tripTools[call.call_id] = tripToolDefaults(call, messageId);
        } else if (messageId) {
          existing.messageId = messageId;
        }
        // 三个槽位都齐时卡片显示“将为你规划：……”，等用户确认后才提交规划。
        renderTripTool(call.call_id, { focus: shouldScroll });
        if (shouldScroll) {
          const container = document.getElementById("chatMessages");
          container.scrollTop = container.scrollHeight;
        }
      }

      function localIso(date) {
        const offset = date.getTimezoneOffset() * 60000;
        return new Date(date.getTime() - offset).toISOString().slice(0, 10);
      }

      function formatTripDate(iso) {
        const [year, month, day] = iso.split("-").map(Number);
        const date = new Date(year, month - 1, day);
        return `${month}月${day}日 ${WEEKDAYS[date.getDay()]}`;
      }

      // 常用出发日期按今天换算成具体日期：后端只接受 YYYY-MM-DD。
      function tripDateOptions() {
        const now = new Date();
        const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
        const thisSaturday = new Date(today);
        thisSaturday.setDate(today.getDate() + ((6 - today.getDay() + 7) % 7));
        const nextSaturday = new Date(thisSaturday);
        nextSaturday.setDate(thisSaturday.getDate() + 7);
        const nextMonth = new Date(today.getFullYear(), today.getMonth() + 1, 1);
        return [
          { label: "本周末", value: localIso(thisSaturday) },
          { label: "下周末", value: localIso(nextSaturday) },
          { label: "下个月初", value: localIso(nextMonth) },
        ];
      }

      function tripStepOptions(step) {
        if (step === 1) {
          return [
            ...TRIP_DESTINATIONS.map((destination) => ({ label: destination, value: destination })),
            { label: "还没想好，帮我推荐", value: "__recommend__" },
          ];
        }
        if (step === 2) {
          return tripDateOptions().map((option) => ({
            ...option,
            hint: formatTripDate(option.value),
          }));
        }
        return TRIP_DAY_OPTIONS.map((days) => ({ label: `${days} 天`, value: String(days) }));
      }

      function tripSummary(tool) {
        return [
          tool.values.destination,
          tool.values.departure_date ? formatTripDate(tool.values.departure_date) : "",
          tool.values.days ? `${tool.values.days} 天` : "",
        ].filter(Boolean).join(" · ");
      }

      function renderTripOtherRow(tool, step, presetValues) {
        const field = tripStepField(step);
        const value = tool.values[field] || "";
        const customValue = presetValues.includes(value) ? "" : value;
        const today = todayIso();
        const input = {
          1: `<input class="trip-tool-input" name="destination" type="text" maxlength="80" placeholder="其他目的地…" value="${escapeAttribute(customValue)}">`,
          2: `<input class="trip-tool-input" name="departure_date" type="date" min="${today}" value="${escapeAttribute(customValue)}" aria-label="选择其他出发日期">`,
          3: `<input class="trip-tool-input" name="days" type="number" min="1" max="30" step="1" placeholder="其他天数（1-30）…" value="${escapeAttribute(customValue)}">`,
        }[step];
        return `
          <label class="trip-tool-row trip-tool-other${customValue ? " selected" : ""}">
            <span class="trip-tool-index"><i class="fa-solid fa-pen" aria-hidden="true"></i></span>
            ${input}
          </label>
        `;
      }

      // 聊天记录里只放一行状态；真正的问题卡片停靠在输入框的位置。
      function renderTripToolStatus(tool) {
        const message = document.getElementById(tool.messageId);
        const content = message && message.querySelector(".message-content");
        if (!content) return;
        let line = findTripToolPanel(tool.callId);
        if (!line) {
          line = document.createElement("div");
          line.className = "trip-tool-status";
          line.dataset.tripCallId = tool.callId;
          content.appendChild(line);
        }
        let text;
        if (tool.status === "completed") text = `<i class="fa-solid fa-circle-check"></i> 旅行规划已提交：${escapeHtml(tripSummary(tool))}`;
        else if (tool.submitting && tool.status !== "recommend_destination") text = `<i class="fa-solid fa-spinner fa-spin"></i> 正在规划：${escapeHtml(tripSummary(tool))}`;
        else if (tool.submitting) text = `<i class="fa-solid fa-spinner fa-spin"></i> 正在推荐目的地…`;
        else if (tool.closed) text = `<button type="button" class="trip-tool-reopen" data-trip-action="reopen">${tool.confirming ? "尚未确认，点击继续" : "未完成，点击继续填写"}</button>`;
        else if (tool.confirming) text = `将为你规划：${escapeHtml(tripSummary(tool))}，等待你确认…`;
        else text = "等待你的回答…";
        line.innerHTML = `
          <div>${text}</div>
          ${tool.recommendation ? `<div class="trip-tool-recommendation">${renderContent("assistant", tool.recommendation)}</div>` : ""}
        `;
        const reopen = line.querySelector('[data-trip-action="reopen"]');
        if (reopen) reopen.addEventListener("click", () => reopenTripTool(tool.callId));
      }

      function activeTripTool() {
        const open = Object.values(state.tripTools).filter((tool) =>
          tool.status !== "completed" && !tool.closed && !tool.submitting
            && document.getElementById(tool.messageId)
        );
        return open[open.length - 1] || null;
      }

      function renderTripTool(callId, { focus = false } = {}) {
        const tool = state.tripTools[callId];
        if (tool) renderTripToolStatus(tool);
        renderTripDock({ focus });
      }

      function renderTripDock({ focus = false } = {}) {
        const area = document.querySelector(".chat-input-area");
        let dock = document.getElementById("tripDock");
        if (!dock) {
          dock = document.createElement("section");
          dock.id = "tripDock";
          dock.className = "trip-tool";
          dock.tabIndex = -1;
          area.prepend(dock);
        }
        const tool = activeTripTool();
        area.classList.toggle("trip-active", Boolean(tool));
        if (!tool) {
          dock.innerHTML = "";
          dock.onkeydown = null;
          return;
        }
        const callId = tool.callId;
        // innerHTML 重绘会丢掉焦点；记下来，重绘后还给卡片，数字键选择才能连续使用。
        const hadFocus = focus || (dock.contains(document.activeElement)
          && !document.activeElement.matches("input"));
        if (tool.confirming) {
          renderTripConfirm(dock, tool, hadFocus);
          return;
        }
        const step = tool.currentStep;
        const page = Math.max(0, tool.askSteps.indexOf(step));
        const total = tool.askSteps.length;
        const isLast = page === total - 1;
        const field = tripStepField(step);
        const options = tripStepOptions(step);
        const presetValues = options.map((option) => option.value);

        dock.innerHTML = `
          <div class="trip-tool-header">
            <div class="trip-tool-title">${TRIP_QUESTIONS[step]}</div>
            <div class="trip-tool-actions">
              <button type="button" class="trip-tool-icon" data-trip-action="back" aria-label="上一题" ${page === 0 ? "disabled" : ""}>
                <i class="fa-solid fa-chevron-left"></i>
              </button>
              <span class="trip-tool-progress">${page + 1}/${total}</span>
              <button type="button" class="trip-tool-icon" data-trip-action="forward" aria-label="下一题" ${isLast ? "disabled" : ""}>
                <i class="fa-solid fa-chevron-right"></i>
              </button>
              <button type="button" class="trip-tool-icon" data-trip-action="close" aria-label="关闭旅行规划表单" title="关闭">
                <i class="fa-solid fa-xmark"></i>
              </button>
            </div>
          </div>
          <div class="trip-tool-list" role="listbox" aria-label="${TRIP_QUESTIONS[step]}">
            ${options.map((option, index) => `
              <button type="button" class="trip-tool-row${option.value === tool.values[field] ? " selected" : ""}" data-option-value="${escapeAttribute(option.value)}" role="option" aria-selected="${option.value === tool.values[field]}">
                <span class="trip-tool-index">${index + 1}</span>
                <span class="trip-tool-label">${escapeHtml(option.label)}${option.hint ? `<small>${escapeHtml(option.hint)}</small>` : ""}</span>
                <i class="fa-solid fa-arrow-right trip-tool-arrow" aria-hidden="true"></i>
              </button>
            `).join("")}
            ${renderTripOtherRow(tool, step, presetValues)}
          </div>
          <div class="trip-tool-error" role="alert">${escapeHtml(tool.errors[field] || tool.errors.form || "")}</div>
          <div class="trip-tool-footer">
            <span class="trip-tool-summary">${isLast ? escapeHtml(tripSummary(tool)) : ""}</span>
            <button type="button" class="trip-tool-send" data-trip-action="next" aria-label="${isLast ? "提交规划" : "下一题"}" title="${isLast ? "提交规划" : "下一题"}">
              <i class="fa-solid fa-arrow-up"></i>
            </button>
          </div>
        `;
        if (hadFocus) dock.focus({ preventScroll: true });

        dock.querySelector('[data-trip-action="close"]').addEventListener("click", () => closeTripTool(callId));
        dock.querySelector('[data-trip-action="back"]').addEventListener("click", () => changeTripStep(callId, -1));
        dock.querySelector('[data-trip-action="forward"]').addEventListener("click", () => changeTripStep(callId, 1));
        dock.querySelector('[data-trip-action="next"]').addEventListener("click", () => advanceTripTool(callId));
        dock.querySelectorAll("[data-option-value]").forEach((button) => {
          button.addEventListener("click", () => chooseTripOption(callId, button.dataset.optionValue));
        });
        dock.querySelectorAll("input[name]").forEach((input) => {
          input.addEventListener("input", () => {
            tool.values[input.name] = input.value;
            tool.errors[input.name] = "";
          });
          input.addEventListener("keydown", (event) => {
            if (event.key === "Enter") {
              event.preventDefault();
              advanceTripTool(callId);
            }
          });
        });
        dock.onkeydown = (event) => {
          if (event.key === "Escape") {
            event.preventDefault();
            closeTripTool(callId);
            return;
          }
          if (event.target.matches("input")) return;
          const index = Number(event.key) - 1;
          if (Number.isInteger(index) && index >= 0 && index < options.length) {
            event.preventDefault();
            chooseTripOption(callId, options[index].value);
          } else if (event.key === "Enter" && !event.target.matches("button")) {
            event.preventDefault();
            advanceTripTool(callId);
          }
        };
      }

      // 三个槽位都已知：显示将要规划的内容，确认后才提交；也可以改成逐题修改。
      function renderTripConfirm(dock, tool, hadFocus) {
        const callId = tool.callId;
        dock.innerHTML = `
          <div class="trip-tool-header">
            <div class="trip-tool-title">将为你规划：${escapeHtml(tripSummary(tool))}</div>
            <div class="trip-tool-actions">
              <button type="button" class="trip-tool-icon" data-trip-action="close" aria-label="关闭确认" title="关闭">
                <i class="fa-solid fa-xmark"></i>
              </button>
            </div>
          </div>
          <div class="trip-tool-list" role="listbox" aria-label="是否确认规划">
            <button type="button" class="trip-tool-row" data-trip-action="confirm" role="option">
              <span class="trip-tool-index">1</span>
              <span class="trip-tool-label">确认，开始规划</span>
              <i class="fa-solid fa-arrow-right trip-tool-arrow" aria-hidden="true"></i>
            </button>
            <button type="button" class="trip-tool-row" data-trip-action="edit" role="option">
              <span class="trip-tool-index">2</span>
              <span class="trip-tool-label">修改<small>重新选择目的地、日期或天数</small></span>
              <i class="fa-solid fa-arrow-right trip-tool-arrow" aria-hidden="true"></i>
            </button>
          </div>
          <div class="trip-tool-error" role="alert">${escapeHtml(tool.errors.form || "")}</div>
        `;
        if (hadFocus) dock.focus({ preventScroll: true });
        dock.querySelector('[data-trip-action="close"]').addEventListener("click", () => closeTripTool(callId));
        dock.querySelector('[data-trip-action="confirm"]').addEventListener("click", () => confirmTripTool(callId));
        dock.querySelector('[data-trip-action="edit"]').addEventListener("click", () => editTripTool(callId));
        dock.onkeydown = (event) => {
          if (event.key === "Escape") {
            event.preventDefault();
            closeTripTool(callId);
          } else if (event.key === "1" || (event.key === "Enter" && !event.target.matches("button"))) {
            event.preventDefault();
            confirmTripTool(callId);
          } else if (event.key === "2") {
            event.preventDefault();
            editTripTool(callId);
          }
        };
      }

      function confirmTripTool(callId) {
        const tool = state.tripTools[callId];
        if (!tool || tool.submitting) return;
        submitTripToolResult(callId, "completed");
      }

      // 从确认改为逐题修改：三题都重新过一遍，已有的值保持选中。
      function editTripTool(callId) {
        const tool = state.tripTools[callId];
        if (!tool || tool.submitting) return;
        tool.confirming = false;
        tool.askSteps = [1, 2, 3];
        tool.currentStep = 1;
        renderTripTool(callId, { focus: true });
      }

      // 点选项即作答：不是最后一题就翻页，最后一题只选中，由发送按钮提交，避免误触发规划。
      function chooseTripOption(callId, value) {
        const tool = state.tripTools[callId];
        if (!tool || tool.submitting) return;
        if (tool.currentStep === 1 && value === "__recommend__") {
          submitTripToolResult(callId, "recommend_destination");
          return;
        }
        const field = tripStepField(tool.currentStep);
        tool.values[field] = value;
        tool.errors[field] = "";
        const isLast = tool.askSteps.indexOf(tool.currentStep) === tool.askSteps.length - 1;
        if (!isLast) changeTripStep(callId, 1);
        else renderTripTool(callId);
      }

      function advanceTripTool(callId) {
        const tool = state.tripTools[callId];
        if (!tool) return;
        const isLast = tool.askSteps.indexOf(tool.currentStep) === tool.askSteps.length - 1;
        if (!isLast) changeTripStep(callId, 1);
        else submitTripToolResult(callId, "completed");
      }

      function closeTripTool(callId) {
        const tool = state.tripTools[callId];
        if (!tool) return;
        tool.closed = true;
        renderTripTool(callId);
        document.getElementById("chatInput").focus();
      }

      function reopenTripTool(callId) {
        const tool = state.tripTools[callId];
        if (!tool) return;
        tool.closed = false;
        renderTripTool(callId, { focus: true });
      }

      function validateTripToolStep(tool) {
        const field = tripStepField(tool.currentStep);
        const message = tripStepError(tool.currentStep, tool.values);
        tool.errors = message ? { [field]: message } : {};
        return !message;
      }

      // 确保某个槽位在问题列表里（比如推荐后要回到目的地，或提交时发现预填值已失效）。
      function ensureTripStep(tool, step) {
        if (!tool.askSteps.includes(step)) {
          tool.askSteps = [...tool.askSteps, step].sort((a, b) => a - b);
        }
        tool.currentStep = step;
      }

      function changeTripStep(callId, direction) {
        const tool = state.tripTools[callId];
        if (!tool || direction > 0 && !validateTripToolStep(tool)) {
          if (tool) renderTripTool(callId);
          return;
        }
        const page = tool.askSteps.indexOf(tool.currentStep);
        const next = Math.max(0, Math.min(tool.askSteps.length - 1, page + direction));
        tool.currentStep = tool.askSteps[next];
        renderTripTool(callId);
      }

      function applyTripToolResult(result, callId, shouldScroll = true) {
        if (!result || !callId || !state.tripTools[callId]) return;
        const tool = state.tripTools[callId];
        if (result.partial_values) {
          tool.values = { ...tool.values, ...result.partial_values };
        }
        if (result.status === "awaiting_destination") {
          tool.status = "awaiting_destination";
          tool.recommendation = result.message || tool.recommendation;
          ensureTripStep(tool, 1);
          tool.closed = false;
        } else if (result.status === "completed") {
          tool.status = "completed";
          if (result.result && result.result.destination) {
            tool.values = { ...tool.values, ...result.result };
          }
        }
        renderTripTool(callId);
        if (shouldScroll) {
          const container = document.getElementById("chatMessages");
          container.scrollTop = container.scrollHeight;
        }
      }

      const workerLabels = {
        attractions: "景点",
        weather: "天气",
        transport: "交通",
        hotel: "住宿",
        food: "美食",
      };

      function renderWorkerResults(draft) {
        const results = Array.isArray(draft?.worker_results) ? draft.worker_results : [];
        if (!results.length) return "";
        const rows = results.map((result) => {
          const sources = (result.evidence || []).map((item) =>
            `<li>${escapeHtml(item.source)}<br>${escapeHtml(item.content || "")}</li>`
          ).join("");
          const warnings = (result.warnings || []).map((item) => `<li>${escapeHtml(item)}</li>`).join("");
          return `<div class="worker-row ${escapeAttribute(result.status || "unavailable")}">
            <div class="worker-row-head"><strong>${escapeHtml(workerLabels[result.worker] || result.worker || "Worker")}</strong><span class="worker-status">${escapeHtml(result.status || "unavailable")}</span></div>
            <p>${escapeHtml(result.summary || "")}</p>
            ${sources ? `<details><summary>证据来源（${result.evidence.length}）</summary><ul>${sources}</ul></details>` : ""}
            ${warnings ? `<details><summary>提示（${result.warnings.length}）</summary><ul>${warnings}</ul></details>` : ""}
          </div>`;
        }).join("");
        return `<section class="worker-results"><div class="worker-results-title"><span>Worker 研究结果</span><span class="worker-results-label">本地模拟资料</span></div>${rows}</section>`;
      }

      function appendWorkerResults(messageId, draft) {
        const message = document.getElementById(messageId);
        if (!message) return;
        const content = message.querySelector(".message-content");
        if (!content || content.querySelector(".worker-results")) return;
        content.insertAdjacentHTML("beforeend", renderWorkerResults(draft));
      }

      function appendAgentToolResult(messageId, payload, shouldScroll = true) {
        const message = document.getElementById(messageId);
        if (!message) return;
        const content = message.querySelector(".message-content");
        if (!content) return;
        const result = payload?.result || payload;
        const card = document.createElement("section");
        card.className = "worker-results agent-tool-result";
        const warnings = Array.isArray(result?.warnings) ? result.warnings : [];
        card.innerHTML = `<div class="worker-results-title"><span>Agent Tool: ${escapeHtml(result?.worker || payload?.tool || "research")}</span><span class="worker-results-label">${escapeHtml(result?.status || payload?.status || "unknown")}</span></div>
          <p>${escapeHtml(result?.answer || "")}</p>
          <small>Evidence: ${Number(result?.evidence_count || 0)}</small>
          ${warnings.length ? `<details><summary>Warnings (${warnings.length})</summary><ul>${warnings.map((item) => `<li>${escapeHtml(item)}</li>`).join("")}</ul></details>` : ""}`;
        content.appendChild(card);
        if (shouldScroll) document.getElementById("chatMessages").scrollTop = document.getElementById("chatMessages").scrollHeight;
      }

      function appendResearchEvent(messageId, event, shouldScroll = true) {
        const message = document.getElementById(messageId);
        if (!message) return;
        const content = message.querySelector(".message-content");
        if (!content) return;
        const payload = event?.payload || event || {};
        const type = event?.type || "research_event";
        const label = type.replaceAll("_", " ");
        const line = document.createElement("div");
        line.className = `research-event ${escapeAttribute(type)}`;
        line.innerHTML = `<strong>${escapeHtml(label)}</strong><span>${escapeHtml(payload.worker || payload.tool_name || "")}</span>${payload.evidence_count != null ? `<small>Evidence: ${Number(payload.evidence_count)}</small>` : ""}${payload.conflict_count != null ? `<small>Conflicts: ${Number(payload.conflict_count)}</small>` : ""}`;
        content.appendChild(line);
        if (shouldScroll) document.getElementById("chatMessages").scrollTop = document.getElementById("chatMessages").scrollHeight;
      }

      async function submitTripToolResult(callId, status) {
        const tool = state.tripTools[callId];
        if (!tool || tool.submitting) return;
        if (status === "completed") {
          const invalidStep = missingTripSteps(tool.values)[0];
          if (invalidStep) {
            ensureTripStep(tool, invalidStep);
            validateTripToolStep(tool);
            tool.closed = false;
            renderTripTool(callId, { focus: true });
            return;
          }
          tool.values.days = String(Number(tool.values.days));
        }
        const partial_values = Object.fromEntries(
          Object.entries(tool.values).filter(([, value]) => String(value).trim() !== "")
        );
        tool.submitting = true;
        tool.closed = false;
        const isRecommendation = status === "recommend_destination";
        if (isRecommendation) tool.status = "recommend_destination";
        renderTripTool(callId);
        let recommendationText = tool.recommendation || "";
        let finalText = "";
        let finalMessageId = isRecommendation ? null : addMessage("assistant", "");
        try {
          const body = isRecommendation
            ? { tool: tool.tool, status: "recommend_destination", partial_values }
            : { tool: tool.tool, status: "completed", result: {
                destination: tool.values.destination,
                departure_date: tool.values.departure_date,
                days: Number(tool.values.days),
              } };
          const response = await fetch(`${getApiBase()}/api/v1/chat/tools/${callId}/result`, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Authorization: `Bearer ${state.token}`,
            },
            body: JSON.stringify(body),
          });
          if (!response.ok) throw new Error("Tool result request failed");
          await parseSseStream(response, (parsed) => {
            if (!parsed) return;
            if (parsed.type === "token" && parsed.content) {
              if (isRecommendation) {
                recommendationText += parsed.content;
                tool.recommendation = recommendationText;
                renderTripTool(callId);
              } else {
                finalText += parsed.content;
                updateMessage(finalMessageId, finalText);
              }
            } else if (parsed.type === "tool_result") {
              applyTripToolResult(parsed, callId);
            } else if (parsed.type === "result" && !isRecommendation) {
              tool.status = "completed";
              renderTripTool(callId);
              appendWorkerResults(finalMessageId, parsed.payload?.result || parsed.result);
            } else if (parsed.type === "error") {
              throw new Error(parsed.message || "Tool result failed");
            }
          });
        } catch (error) {
          tool.errors.form = "提交失败，请稍后重试。";
          tool.status = "pending";
        } finally {
          tool.submitting = false;
          renderTripTool(callId);
        }
      }

      function restorePendingTool() {
        Object.values(state.tripTools).forEach((tool) => {
          if (tool.status !== "completed" && !tool.closed) renderTripTool(tool.callId);
        });
      }

      async function parseSseStream(response, onEvent) {
        if (!response.body) return;
        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let sseBuffer = "";
        const dispatch = async (frame) => {
          const data = frame
            .split(/\r?\n/)
            .filter((line) => line.startsWith("data:"))
            .map((line) => line.slice(5).trimStart())
            .join("\n");
          if (!data) return;
          try {
            await onEvent(JSON.parse(data), data);
          } catch (error) {
            if (error instanceof SyntaxError) await onEvent(null, data);
            else throw error;
          }
        };
        while (true) {
          const { value, done } = await reader.read();
          sseBuffer += decoder.decode(value || new Uint8Array(), { stream: !done });
          const frames = sseBuffer.split(/\r?\n\r?\n/);
          sseBuffer = frames.pop() || "";
          for (const frame of frames) await dispatch(frame);
          if (done) break;
        }
        if (sseBuffer.trim()) await dispatch(sseBuffer);
      }

      async function sendMessage() {
        const input = document.getElementById("chatInput");
        const content = input.value.trim();
        if (!content || state.isLoading) return;

        if (!state.currentConversationId) {
          await createNewConversation();
          if (!state.currentConversationId) return;
        }

        state.isLoading = true;
        document.getElementById("sendBtn").disabled = true;

        // 移除欢迎页
        const welcome = document.querySelector(".welcome-screen");
        if (welcome) welcome.remove();

        // 用户消息
        addMessage("user", content);
        input.value = "";
        input.style.height = "auto";

        // 助手Loading
        const loadingId = addLoading();

        try {
          const res = await fetch(
            `${getApiBase()}/api/v1/chat/stream/${state.currentConversationId}`,
            {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                Authorization: `Bearer ${state.token}`,
              },
              body: JSON.stringify({ content }),
            }
          );

          removeMessage(loadingId);

          if (
            res.ok &&
            res.headers.get("content-type")?.includes("event-stream")
          ) {
            let fullText = "";
            const msgId = addMessage("assistant", "");
            await parseSseStream(res, (parsed, raw) => {
              if (!parsed) {
                fullText += raw;
                updateMessage(msgId, fullText);
              } else if (parsed.type === "token" && parsed.content) {
                fullText += parsed.content;
                updateMessage(msgId, fullText);
              } else if (parsed.type === "tool_call") {
                const call = parsed.payload || parsed;
                if (call.tool === "collect_trip_requirements") receiveTripToolCall(call, msgId);
                else appendResearchEvent(msgId, { type: "agent_tool_call", payload: call });
              } else if (parsed.type === "tool_result") {
                appendAgentToolResult(msgId, parsed.payload || parsed);
              } else if (["subagent_started", "subagent_completed", "subagent_tool_call", "subagent_tool_completed", "follow_up_search", "evidence_collected", "research_conflict"].includes(parsed.type)) {
                appendResearchEvent(msgId, parsed);
              } else if (parsed.type === "result") {
                appendWorkerResults(msgId, parsed.payload?.result || parsed.result);
              } else if (parsed.type === "error") {
                fullText += `\n\n> ${parsed.message || "旅行规划失败，请稍后重试。"}`;
                updateMessage(msgId, fullText);
              }
            });
          } else {
            const data = await res.json();
            addMessage(
              "assistant",
              data.content || data.message || JSON.stringify(data)
            );
          }
        } catch (e) {
          removeMessage(loadingId);
          addMessage("assistant", "连接中断，请稍后重试。");
        }

        state.isLoading = false;
        document.getElementById("sendBtn").disabled = false;
      }

      // 渲染消息内容：assistant 走 Markdown 渲染，user 走纯文本转义
      function renderContent(role, text) {
        if (role === "assistant" && typeof marked !== "undefined") {
          const html = marked.parse(text || "");
          // 用 DOMPurify 消毒，防止 XSS
          if (typeof DOMPurify !== "undefined") {
            return DOMPurify.sanitize(html);
          }
          return html;
        }
        return escapeHtml(text);
      }

      function addMessage(role, text) {
        const container = document.getElementById("chatMessages");
        const id = "msg-" + Date.now();
        const div = document.createElement("div");
        div.className = `message ${role}`;
        div.id = id;
        div.innerHTML = `
                <div class="message-avatar"><i class="fa-solid ${
                  role === "user" ? "fa-user" : "fa-robot"
                }"></i></div>
                <div class="message-content">${renderContent(role, text)}</div>
            `;
        container.appendChild(div);
        container.scrollTop = container.scrollHeight;
        return id;
      }

      function updateMessage(id, text) {
        const el = document.getElementById(id);
        if (el) {
          const isAssistant = el.classList.contains("assistant");
          const role = isAssistant ? "assistant" : "user";
          el.querySelector(".message-content").innerHTML = renderContent(
            role,
            text
          );
          document.getElementById("chatMessages").scrollTop =
            document.getElementById("chatMessages").scrollHeight;
        }
      }

      function addLoading() {
        const container = document.getElementById("chatMessages");
        const id = "loading-" + Date.now();
        const div = document.createElement("div");
        div.className = "message assistant";
        div.id = id;
        div.innerHTML = `
                <div class="message-avatar"><i class="fa-solid fa-robot"></i></div>
                <div class="message-content">
                    <div class="typing-dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
                </div>
            `;
        container.appendChild(div);
        container.scrollTop = container.scrollHeight;
        return id;
      }

      function removeMessage(id) {
        const el = document.getElementById(id);
        if (el) el.remove();
      }

      function handleInputKeydown(e) {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          window.sendMessage();
        }
      }

      function autoResizeTextarea() {
        const el = document.getElementById("chatInput");
        el.addEventListener("input", function () {
          this.style.height = "auto";
          this.style.height = Math.min(this.scrollHeight, 120) + "px";
        });
      }

      function showToast(msg, isError = false) {
        const t = document.getElementById("toast");
        document.getElementById("toastMsg").textContent = msg;
        t.className = `toast show ${isError ? "error" : ""}`;
        setTimeout(() => t.classList.remove("show"), 3000);
      }

      function formatTime(str) {
        if (!str) return "";
        const d = new Date(str);
        return `${d.getMonth() + 1}月${d.getDate()}日`;
      }

      function escapeHtml(text) {
        if (!text) return "";
        const div = document.createElement("div");
        div.textContent = text;
        return div.innerHTML.replace(/\n/g, "<br>");
      }
    </script>
  </body>
</html>
